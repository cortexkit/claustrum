name: Release

# TAG-TRIGGERED, AND THE ASSETS ARE BUILT ON THE PLATFORM THEY RUN ON. That is not a
# convenience: this workspace links `ring`, whose x86-64 routines are hand-written
# perlasm, and a cross-build from a darwin laptop failed at link with every one of those
# symbols undefined (bn_mul_mont_nohw, bn_gather5, gcm_init_avx) after the C half had
# already compiled cleanly through a zig shim. A native runner has no shim, no cross
# toolchain, and no assembly question, because it IS the target.
#
# For a CREDENTIAL VAULT specifically that also removes the whole "it built on the
# maintainer's laptop" class from the artifact anyone installs.
on:
  push:
    tags:
      - "v*"
  # Manual, so a release can be re-cut when a tag already exists (a dropped webhook, or
  # assets re-uploaded after a workflow fix) without inventing a throwaway tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and upload assets for"
        required: true
      replace_published:
        description: "Explicitly replace assets on an already-published release"
        type: boolean
        default: false
      notes:
        description: "Release-specific migration and compatibility notes"
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # THE RELEASE MUST EXIST BEFORE ANY ASSET UPLOADS INTO IT, and `gh release upload`
  # does NOT create one -- it resolves the tag to an existing release and fails if there
  # is none. Without this job the whole workflow depends on a human having run
  # `gh release create` first, in the right order, every time; get it backwards and three
  # runners build perfectly and then all fail at the last step.
  #
  # It is a SEPARATE JOB rather than a step in the matrix because three runners starting
  # together would race to create the same release, and two would fail. One job, once,
  # then the matrix fans out behind `needs`.
  #
  # Draft, so a release cannot be seen with a partial asset set: the last job publishes it
  # only after every platform has uploaded. A watcher polling for the release either does
  # not see it or sees it complete.
  prepare:
    permissions:
      contents: write
    name: Ensure the release exists
    runs-on: ubuntu-latest
    steps:
      # A TAG CAN POINT AT A COMMIT THAT IS NOT ON master, and nothing else here notices.
      #
      # Every other guard in this repo protects a LOCAL artefact: the staging script
      # refuses a dirty tree, a wrong branch, and a commit CI has never seen. The release
      # path is the one that produces PUBLIC binaries other seats install, and it had none
      # of them, because tags are made by hand.
      #
      # Measured before writing this: v0.1.0, v0.1.1, v0.1.2 and v0.1.3 are all ancestors
      # of master. Four for four, by care rather than by construction -- which is exactly
      # the state that reads as a working process right up until the one time it is not.
      #
      # NOT the same failure as the staging guard's. Pushing a tag pushes the object, so a
      # released binary is always fetchable and reproducible. What a non-ancestor tag
      # breaks is the claim that the released code passed the master CI matrix: this
      # workflow verifies the tag-version match and runs `--version` on the signed binary,
      # and it is NOT the ubuntu + windows suite.
      #
      # No override. A release is the one act here with no legitimate off-master case: a
      # binary other people install from a commit that is not on the branch is a
      # supply-chain shape rather than a convenience.
      # fetch-depth 0 because merge-base needs history: the default shallow checkout has
      # one commit, and `--is-ancestor` against it answers about a graph that is not there.
      # A shallow clone would make this guard fail OPEN or CLOSED depending on luck, which
      # is worse than not having it.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Refuse a tag that is not on master
        run: |
          set -euo pipefail
          git fetch --quiet origin master
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "REFUSING: $(git rev-parse --short HEAD) is not an ancestor of origin/master." >&2
            echo "  A released binary is installed by other seats. Off master it has not" >&2
            echo "  passed the ubuntu + windows suite, and this workflow does not run it." >&2
            echo "  Land the commit first, then move the tag." >&2
            exit 1
          fi
          echo "tag commit $(git rev-parse --short HEAD) is on master"

      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPLACE_PUBLISHED: ${{ inputs.replace_published || false }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          cat > release-notes.txt <<'NOTES'
          Assets are built on the platform they run on. Each zip has a SHA-256
          sidecar holding the digest of the zip bytes.

          The macOS binaries are ad-hoc signed, not notarized: a browser-downloaded
          zip carries a quarantine attribute and Gatekeeper will refuse it.
          Installing via curl does not apply that attribute.

          claustrum does not self-initialize. Run `ck auth bootstrap` before enabling
          the module, or the daemon will exit with 'no master key has been provisioned'.
          On Linux and Windows there is no keychain, so bootstrap with `--key-path`
          and give the daemon the same path via CK_MASTER_KEY_PATH.

          REQUIRES subc 0.17.20 OR NEWER. An older supervisor refuses this module's
          HELLO with 'malformed HELLO body: missing field `consumes`' and parks it
          after three restarts. The error names a protocol field rather than a version,
          so it reads as a broken release; the supervisor predates that field becoming optional.
          NOTES
          if [ -n "$RELEASE_NOTES" ]; then
            printf '\n%s\n' "$RELEASE_NOTES" >> release-notes.txt
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
            if [ "$draft" != "true" ] && [ "$REPLACE_PUBLISHED" != "true" ]; then
              echo "REFUSING: $TAG is published; set replace_published explicitly to replace its assets." >&2
              exit 1
            fi
            # Hide the release while its replacement asset set is incomplete.
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=true --notes-file release-notes.txt
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --draft --verify-tag \
              --notes-file release-notes.txt
          fi

  assets:
    permissions:
      contents: write
    name: ${{ matrix.asset_os }}-${{ matrix.asset_arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      # NEVER fail-fast. One platform failing must not cancel the others: a release with
      # two of three assets is incomplete and installable, while a release with zero is
      # neither. The absent one reads as "not yet published for that platform", which the
      # installer treats as temporal rather than as a failed install.
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            asset_os: darwin
            asset_arch: arm64
          - runner: ubuntu-latest
            asset_os: linux
            asset_arch: x64
          - runner: windows-latest
            asset_os: windows
            asset_arch: x64
    defaults:
      run:
        working-directory: claustrum
    steps:
      - name: Checkout claustrum
        uses: actions/checkout@v5
        with:
          path: claustrum
          ref: ${{ inputs.tag || github.ref }}

      # THE STAMP MUST NAME THE COMMIT THAT WAS CHECKED OUT, WHICH IS NOT `github.sha`.
      # On a workflow_dispatch for an existing tag, `github.sha` is the DISPATCHED ref
      # (master) while the checkout above used `inputs.tag`. v0.1.0 shipped that way: the
      # source was the tag and the stamp was master, so the published binaries reported a
      # revision they were not built from. Harmless there only because the two commits
      # differed by zero non-workflow files -- luck, not design. Dispatching for an older
      # tag after code has moved would put a confidently wrong commit in a credential
      # vault's --version, which is the value an operator uses to find the source they are
      # running.
      #
      # `git rev-parse HEAD` in the checkout answers what was ACTUALLY built.
      - name: Resolve the built revision
        id: rev
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # THE TAG AND THE CRATE VERSION MUST AGREE, and this gate exists because they did
      # not in v0.1.1 and it broke the installer for every new user on every platform.
      #
      # The release index derives an expected version from the tag (`v<ver>` -> `<ver>`)
      # and `ck setup` then places the binary, runs `--version`, and REQUIRES that
      # substring. v0.1.1 shipped binaries printing `0.1.0` because the crate version was
      # never bumped, so acceptance refused and the placement rolled back -- a state
      # strictly worse than the release it superseded, which at least matched its tag.
      #
      # I called that cosmetic when I shipped it. It was not: the version string is an
      # INPUT to another repo's acceptance check, and a field one consumer parses is not
      # decoration however much it looks like a label. Refusing here makes the mismatch
      # unshippable rather than remembered.
      - name: Refuse a tag that disagrees with the crate version
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$TAG"
          want="${tag#v}"
          have=$(cargo metadata --no-deps --format-version 1 \
                 | python3 -c 'import json,sys; m=json.load(sys.stdin); \
                   print(next(p["version"] for p in m["packages"] \
                   if p["name"]=="credentials-module"))')
          echo "tag wants $want; crate reports $have"
          if [ "$want" != "$have" ]; then
            echo "REFUSING: tag $tag implies version $want but the crate is $have."
            echo "The release index derives the expected version from the tag and"
            echo "\`ck setup\` requires it as a substring of --version, so these assets"
            echo "would fail acceptance on every platform. Bump the crate versions to"
            echo "$want, or tag v$have."
            exit 1
          fi

      # CK_BUILD_REV IS THE POINT OF THIS STEP, and it is here because hand-building the
      # first alpha assets without it produced two binaries that answered `--version` with
      # "0.1.0 (unknown)". A vault that cannot name its own revision fails the first leg of
      # every acceptance ladder, and the operator has no way to tell which build they hold.
      # --locked so the published artifact resolves the committed lockfile, never a drifted one.
      - name: Build release binaries
        shell: bash
        env:
          CK_BUILD_REV: ${{ steps.rev.outputs.sha }}
        run: cargo build --locked --release --bin ck-claustrum --bin ck-auth

      # Ad-hoc signature with the PINNED identifier. Default ad-hoc signing derives an
      # identifier containing the Mach-O LC_UUID, which changes on every link, and on this
      # fleet that silently revokes macOS privacy grants keyed to the old identifier.
      # Pinning it keeps one stable identity across builds.
      #
      # NOT NOTARIZED. Gatekeeper only assesses files carrying a quarantine xattr, which
      # the `curl | sh` install path never applies (curl does not opt into quarantine, and
      # CLI unzip propagates none) -- measured, with a positive control proving the checker
      # can see the attribute when it is present. A BROWSER-downloaded zip is quarantined
      # and will be refused until a Developer ID cert exists.
      #
      # HARDENED RUNTIME, as in scripts/release-build.sh: without it a same-UID process can
      # attach a debugger and read the daemon's memory (master key, unsealed credentials,
      # launch secret). No entitlements are needed; both binaries load no unsigned
      # libraries and use no JIT.
      - name: Sign with pinned identifiers (macOS)
        if: matrix.asset_os == 'darwin'
        run: |
          for b in ck-claustrum ck-auth; do
            codesign --force --sign - --options runtime --identifier "$b" "target/release/$b"
            # Capture, then match: the runner's bash uses pipefail, so `codesign | grep -q`
            # can fail on a good binary when grep exits before codesign finishes writing.
            signature="$(codesign -dv "target/release/$b" 2>&1)"
            case "$signature" in
              *"Identifier=$b"*) ;;
              *) echo "REFUSING: $b did not take the pinned identifier"; exit 1 ;;
            esac
            case "$signature" in
              *flags=*runtime*) ;;
              *) echo "REFUSING: $b was signed without the hardened runtime"; exit 1 ;;
            esac
          done

      # ANSWERED BY THE FIRST RUN: Git Bash on the windows runner has NO `zip`.
      #
      #   D:\a\_temp\....sh: line 7: zip: command not found   exit 127
      #
      # I had shipped this flagged as unverified, having tried to settle it by grepping
      # the runner image readme -- which returned zero and meant nothing, because that
      # readme lists no shell utilities at all (`tar`, `curl`, `zip` all read zero). The
      # draft mechanism is what made shipping the unknown safe: windows failed, publish
      # was skipped, and the release sat as a draft with 8 of 12 assets instead of
      # publishing incomplete.
      #
      # The fix is tool DETECTION rather than a platform branch, because the platform is
      # not the fact that matters -- the available archiver is. `pick_archiver` tries
      # zip, then 7z (present on the windows image), then PowerShell's Compress-Archive,
      # and REFUSES loudly if none exist rather than silently skipping the asset.
      #
      # The sidecar is the hex sha256 OF THE ZIP BYTES, written beside the zip under the
      # same stem. Computed after the zip exists and verified against it here rather than
      # trusted: a digest that does not describe its own artifact is worse than none,
      # because the installer's integrity check would pass on the wrong file.
      - name: Package assets
        shell: bash
        run: |
          set -euo pipefail
          # $1 = zip name, $2 = file, run from inside the directory holding both.
          make_zip() {
            if command -v zip >/dev/null 2>&1; then
              zip -q "$1" "$2"
            elif command -v 7z >/dev/null 2>&1; then
              7z a -tzip -bso0 -bsp0 "$1" "$2" >/dev/null
            elif command -v powershell >/dev/null 2>&1; then
              powershell -NoProfile -NonInteractive -Command \
                "Compress-Archive -Path '$2' -DestinationPath '$1' -Force"
            else
              echo "REFUSING: no archiver on this runner (tried zip, 7z, powershell)" >&2
              exit 1
            fi
          }
          out="dist"; mkdir -p "$out"
          ext=""; [ "${{ matrix.asset_os }}" = "windows" ] && ext=".exe"
          for b in ck-claustrum ck-auth; do
            name="$b-${{ matrix.asset_os }}-${{ matrix.asset_arch }}"
            cp "target/release/$b$ext" "$out/$b$ext"
            (cd "$out" && make_zip "$name.zip" "$b$ext" && rm -f "$b$ext")
            # TWO-FIELD `shasum` FORMAT (hex, two spaces, filename), NOT bare hex.
            # v0.1.0 shipped bare hex and I verified it against the installer's parser,
            # which accepts both forms -- then concluded "nothing to fix". Wrong
            # consumer. `shasum -c <sidecar>` is the obvious thing a careful user runs,
            # and against bare hex it answers:
            #
            #   shasum: ...sha256: no properly formatted SHA checksum lines found
            #
            # A verification tool refusing to parse the digest file reads as a failed
            # integrity check on a good download. Measured against the published v0.1.0
            # asset, with a two-field control returning OK on the same bytes.
            if command -v shasum >/dev/null 2>&1; then
              (cd "$out" && shasum -a 256 "$name.zip" > "$name.zip.sha256")
            else
              (cd "$out" && sha256sum "$name.zip" > "$name.zip.sha256")
            fi
            # Verify by REPLAYING the consumer's own command rather than re-deriving a
            # digest and string-comparing: `shasum -c` exercises the file's format as
            # well as its contents, which is the half that shipped broken in v0.1.0.
            (cd "$out" && if command -v shasum >/dev/null 2>&1; then
                 shasum -c "$name.zip.sha256"
               else sha256sum -c "$name.zip.sha256"; fi \
               || { echo "REFUSING: $name.zip.sha256 does not verify $name.zip"; exit 1; })
            echo "$name.zip  $(awk '{print $1}' "$out/$name.zip.sha256")"
          done

      # THE ASSET MUST ANSWER FOR ITSELF, from the zip a user actually receives rather than
      # from the build directory. This is the leg that caught "(unknown)" on the hand-built
      # alpha pair, where CK_BUILD_REV was absent and both binaries could not name their
      # own revision.
      #
      # IT RUNS ON ALL THREE PLATFORMS, INCLUDING WINDOWS. An earlier revision skipped
      # windows with the stated reason "the cross-arch case it cannot honestly run in" --
      # a reason that describes no leg of this matrix, since every runner builds for
      # itself. The effect was that the ONE platform I cannot build locally was also the
      # one shipping without its build-identity checked. A skip whose justification does
      # not match the matrix is worse than no skip: it reads as considered.
      - name: Verify the packaged binary reports its revision
        shell: bash
        env:
          BUILT_REV: ${{ steps.rev.outputs.sha }}
        run: |
          set -euo pipefail
          # Same detection shape as packaging: the archiver, not the platform, is the fact.
          source scripts/lib/ckdev-binary.sh
          extract() {
            if command -v unzip >/dev/null 2>&1; then
              unzip -qo "$1"
            elif command -v 7z >/dev/null 2>&1; then
              7z x -y -bso0 -bsp0 "$1" >/dev/null
            elif command -v powershell >/dev/null 2>&1; then
              powershell -NoProfile -NonInteractive -Command \
                "Expand-Archive -Path '$1' -DestinationPath . -Force"
            else
              echo "REFUSING: no extractor on this runner (tried unzip, 7z, powershell)" >&2
              exit 1
            fi
          }
          ext=""; [ "${{ matrix.asset_os }}" = "windows" ] && ext=".exe"
          t=$(mktemp -d); cp dist/*.zip "$t/"
          trap 'rm -rf "$t"' EXIT
          (cd "$t" && for z in *.zip; do extract "$z"; done)
          for b in ck-claustrum ck-auth; do
            smoke_binary="$(ckdev_binary "$t/$b$ext" "$t")"
            v=$("$smoke_binary" --version)
            echo "$b -> $v"
            case "$v" in
              *"unknown"*) echo "REFUSING: $b cannot name its own revision"; exit 1 ;;
            esac
            # Compare against the revision resolved from the CHECKOUT, not against the
            # same expression that produced the stamp. Checking a value against its own
            # source is self-consistent by construction: the v0.1.0 run passed this leg
            # while shipping a stamp that named the wrong commit, because both sides read
            # `github.sha`. A verification that cannot disagree with what it verifies is
            # not a verification.
            case "$v" in
              *"${BUILT_REV:0:7}"*) ;;
              *) echo "REFUSING: $b reports a revision that is not the checked-out source"
                 echo "  reported: $v"
                 echo "  built at: $BUILT_REV"
                 exit 1 ;;
            esac
          done

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          gh release upload "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" --clobber
        working-directory: claustrum

  # PUBLISH LAST, AND ONLY IF EVERY PLATFORM UPLOADED. `needs` on a matrix job waits for
  # ALL legs and skips this job if any failed, so a partial build leaves the release in
  # draft where nobody installs from it. That is deliberate: fail-fast is off so one
  # platform's failure does not cancel the others, and this is what stops that tolerance
  # from publishing an incomplete release.
  #
  # A draft that never publishes is a visible, fixable state. A published release missing
  # a platform looks finished and installs as "not supported on your OS".
  publish:
    permissions:
      contents: write
    name: Publish once every platform is in
    needs: assets
    runs-on: ubuntu-latest
    steps:
      - name: Undraft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          names=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for platform in darwin-arm64 linux-x64 windows-x64; do
            for binary in ck-auth ck-claustrum; do
              for suffix in zip zip.sha256; do
                expected="$binary-$platform.$suffix"
                if ! grep -Fx "$expected" <<< "$names" >/dev/null; then
                  echo "REFUSING to publish: missing $expected. Leaving release in draft." >&2
                  exit 1
                fi
              done
            done
          done
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' > release-notes.txt
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.txt --draft=false
