[workspace]
resolver = "2"
members = ["crates/credentials-core", "crates/credentials-module", "crates/claustrum-client"]

# cortexkit-credentials — a subc-supervised module that holds credentials
# (OAuth tokens, API keys, DSNs) encrypted at rest and serves each consumer the
# credential it needs, kept fresh via vault-owned OAuth refresh. It replaces the
# scattered per-consumer credential acquisition (llm-runner's auth.json read,
# ai-provider-quota's bespoke OAuth paths) with one custody home.
#
# Spec: docs/cortexkit-credentials-contract.md (the security contract — three
# review passes: Oracle, Athena council, Oracle confirm). Build plan: docs/charter.md.
#
# Two-crate split (the standard module shape, template = ai-provider-quota):
#   credentials-core   = pure custody logic (typed VaultRecord, canonical
#                        OAuthCredential, value-level encryption envelope,
#                        bounded refresh adapters, crash-safe refresh state
#                        machine, master-key resolution). No subc dep.
#   credentials-module = the thin subc-wire binary: read surface + admin surface,
#                        capability handles, fault isolation, audit.
#   claustrum-client   = publishable Rust consumer for supervised modules.
#
# All published CortexKit crates come from crates.io, pinned by Cargo.lock.
# Move forward deliberately with `cargo update -p <crate>`.
# CI checks out ../subconscious only to build the ck-subc daemon for real-daemon
# e2e tests and read the push-envelope spec for scripts/check-inbound-contracts.sh.
[workspace.dependencies]
cortexkit-test-support = "0.1.0"
subc-protocol = "0.29.1"
subc-transport = "0.10.0"
subc-os = "0.1.6"

cortexkit-store = "0.2.2"
cortexkit-lease = "0.1.1"
cortexkit-store-types = "0.2.2"
# Cross-binary path identity: resolves a filesystem path to a canonical, platform-
# normalized id (macOS /var->/private/var, symlinks, Windows verbatim/drive-case)
# so two independent binaries agree on a path byte-for-byte. Used to scope the
# keychain master-key item per-vault by canonical data_dir.
cortexkit-paths = "0.1.1"
# Fleet logging (r2): one line format, one dated segment per module per day. Pulled in
# WITHOUT `store-paths`: the daemon is told its data directory by the supervisor at
# HELLO and must not resolve it a second time through another copy of the resolver.
cortexkit-log = { version = "0.3.4", default-features = false }
tracing = "0.1"

# The same rusqlite (bundled) cortexkit-store uses, so the Connection/Transaction
# types the fenced-write closures expose unify with ours.
rusqlite = { version = "0.32", features = ["bundled"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process"] }
async-trait = "0.1"

# HTTP for OAuth refresh adapters (rustls, no native-tls).
#
# `http2` is required by ONE caller and enabled for EVERY caller, because this is a
# workspace dependency and cargo unions features across the graph. APNs speaks HTTP/2
# only — a client built without it negotiates 1.1 and is refused at the transport
# before any request is seen — but the daemon links the same client for OAuth token
# refresh, so its provider requests can now negotiate HTTP/2 where they previously
# could not.
#
# That is a behaviour change to the credential-serving path arriving as a side effect
# of an unrelated feature, and it is recorded here rather than assumed benign: the
# providers are ordinary HTTPS endpoints and reqwest negotiates by ALPN, so a server
# that does not offer h2 continues to be spoken to over 1.1. If a refresh ever fails
# in a way that looks like a transport rather than a credential problem, this line is
# the change to suspect first.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "http2",
] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
url = "2"

# At-rest encryption: XChaCha20-Poly1305 AEAD (256-bit key matches the contract's
# 32-byte CSPRNG master key). The extended 192-bit random nonce is collision-safe
# at any realistic write volume, so the envelope carries no "writes-per-key"
# ceiling to reason about (the structural reason this won over AES-256-GCM, whose
# 96-bit-nonce birthday bound — though safe at our volume — is a latent invariant a
# future high-volume reuse of this primitive could approach). CSPRNG for keys and
# nonces; zeroize scrubs the master key material.
chacha20poly1305 = "0.10"
getrandom = "0.2"
zeroize = { version = "1", features = ["zeroize_derive", "serde"] }
sha2 = "0.10"
hmac = "0.12"
subtle = "2.6"

# ES256 (ECDSA P-256 + SHA-256) for APNs provider tokens. APNs accepts NO other
# algorithm for token auth, and it wants the raw 64-byte r||s signature rather
# than the ASN.1 DER encoding `to_der()` produces -- a DER signature is a valid
# ECDSA signature that APNs rejects, so the encoding is part of the contract.
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
base64 = "0.22"
# RS256 GitHub App assertions. `ring` is already linked through rustls; declaring it
# directly avoids adding RustCrypto's `rsa` crate and its open timing advisory.
ring = "0.17.14"
# RFC 9180 base-mode HPKE keeps the X25519 KEM, HKDF-SHA256 key schedule and
# ChaCha20-Poly1305 AEAD together; ring cannot import a static X25519 recipient
# through its ephemeral agreement API.
hpke = "0.13"
