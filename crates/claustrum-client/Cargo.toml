[package]
name = "cortexkit-claustrum-client"
version = "0.7.1"
edition = "2021"
license = "MIT"
description = "Rust credential vault client for subc-supervised CortexKit modules."
repository = "https://github.com/cortexkit/claustrum"
readme = "README.md"
keywords = ["credentials", "vault", "cortexkit", "subc"]
categories = ["authentication", "api-bindings"]

[features]
default = ["transport"]
transport = ["dep:subc-transport", "dep:subc-os", "dep:tokio"]

[dependencies]
serde = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# Reply error classification uses protocol codes even without a live connection.
subc-protocol = { workspace = true }
subc-transport = { workspace = true, optional = true }
subc-os = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
ring = { workspace = true }
