[package]
name = "cortexkit-claustrum-client"
version = "0.17.3"
edition = "2021"
license = "MIT"
description = "Rust credential vault client for subc-supervised CortexKit modules."
repository = "https://github.com/cortexkit/claustrum"
readme = "README.md"
keywords = ["credentials", "vault", "cortexkit", "subc"]
categories = ["authentication", "api-bindings"]

[features]
default = ["transport", "consumer"]
transport = ["dep:subc-transport", "dep:subc-os", "dep:tokio"]
consumer = ["transport", "dep:subc-client-rs"]

[dependencies]
serde = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = { workspace = true }
zeroize = { workspace = true }
# Wire frame types come from the shared protocol crate.
subc-protocol = { workspace = true }
subc-transport = { workspace = true, optional = true }
subc-os = { workspace = true, optional = true }
subc-client-rs = { version = "0.43.0", optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
ring = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
