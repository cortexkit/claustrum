[package]
name = "credentials-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Credential custody logic for the cortexkit-credentials subc module: typed VaultRecord, canonical OAuthCredential, value-level encryption envelope, bounded refresh adapters, crash-safe refresh state machine, master-key resolution. Pure logic, wire-agnostic."

[features]
# Compiles a test-only pre-commit seam INTO the refresh engine: a hook that fires
# after the intent is durably committed and the new tokens are staged, but BEFORE
# the commit transaction. The kill-9 conformance harness uses it to park a helper
# process at exactly that point so a parent test can SIGKILL it and prove
# reconciliation resolves the interrupted refresh to needs_reauth. OFF by default —
# the release vault contains no block-before-commit code path at all (zero release
# surface for a security boundary).
kill9-test-seam = []

# Gates ONLY the vault-native-login crash-cut helper binary out of release builds.
# Like rotate-test-seam this compiles NO code into the library: the login write is a
# SINGLE atomic fenced transaction (no intent log, no txn1/txn2 window), so the helper
# just brackets that one public store call with park points using public API — there is
# no block-before-commit seam because there is no mid-operation durable state to catch.
login-test-seam = []

# Gates ONLY the master-key-rotation crash-cut helper binary out of release builds.
# Unlike kill9-test-seam this compiles NO code into the library: the rotation
# handover's cut points are the boundaries between discrete PUBLIC operations
# (stage_next -> DB rewrap -> promote), each individually atomic, so the helper just
# parks after a chosen step using public API — no block-before-commit seam in the
# vault. The feature exists solely to keep the test binary out of a normal build.
rotate-test-seam = []

# Gates the module-rename ceremony one-shots (ck_key_move, ck_key_verify) out of
# normal builds. Compiles NO code into the library — both drive the shipped resolver
# API only.
#
# The keychain is the real capability here, not the binary: every one of these tools
# fails closed for anyone who cannot already resolve the master key as the vault
# owner. So this is defence in depth rather than a security boundary. It earns its
# place on ACCIDENT rather than attack: ck_key_move WRITES master-key material, it is
# run roughly once per rename against two directory arguments, and a normal build
# putting it on PATH is how a wrong-argument run becomes reachable years after anyone
# remembers what it does.
migration-tools = []

# The two rename-ceremony one-shots. Gated together because they are used at the same
# moment and never afterwards. Deliberately NOT sharing a gate with ck_usable_audit,
# which stays default-built: that one is an ongoing operator diagnostic, run against a
# healthy live vault whenever the question comes up, and gating a routine check behind
# a feature flag is how it stops being run.
[[bin]]
name = "ck_key_move"
path = "src/bin/ck_key_move.rs"
required-features = ["migration-tools"]

[[bin]]
name = "ck_key_verify"
path = "src/bin/ck_key_verify.rs"
required-features = ["migration-tools"]

# The kill-9 helper process. Only buildable with the seam feature, so it never
# ships in a normal build. The conformance integration test spawns it via
# CARGO_BIN_EXE_kill9_refresh_helper.
[[bin]]
name = "kill9_refresh_helper"
path = "src/bin/kill9_refresh_helper.rs"
required-features = ["kill9-test-seam"]

# The master-key-rotation crash-cut helper. Drives the two-slot handover and parks
# at a chosen cut point so the parent test can SIGKILL it and prove the vault
# reopens (never bricks) from that on-disk state. Test-only via the seam feature.
[[bin]]
name = "rotate_cut_helper"
path = "src/bin/rotate_cut_helper.rs"
required-features = ["rotate-test-seam"]

# The vault-native-login crash-cut helper. Seeds an old oauth credential, then brackets
# the single atomic login write (overwrite) with park points so the parent test can
# SIGKILL before/after it and prove a crashed `login --replace` never strands the
# credential it replaces. Test-only via the seam feature.
[[bin]]
name = "login_cut_helper"
path = "src/bin/login_cut_helper.rs"
required-features = ["login-test-seam"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
cortexkit-store = { workspace = true }
cortexkit-lease = { workspace = true }
cortexkit-store-types = { workspace = true }
cortexkit-paths = { workspace = true }
rusqlite = { workspace = true }
# tokio for the engine's per-credential single-flight async lock (sync feature is
# enough here; the binary brings the full runtime).
tokio = { workspace = true }
chacha20poly1305 = { workspace = true }
getrandom = { workspace = true }
zeroize = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
proptest = { workspace = true }
# Direct sqlite access for the §13 corrupt-envelope conformance test (tamper with a
# row's ciphertext on disk, then prove the read path quarantines fail-closed).
rusqlite = { workspace = true }
