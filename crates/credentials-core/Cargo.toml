[package]
name = "credentials-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Credential custody logic for the cortexkit-credentials subc module: typed VaultRecord, canonical OAuthCredential, value-level encryption envelope, bounded refresh adapters, crash-safe refresh state machine, master-key resolution. Pure logic, wire-agnostic."

[features]
# Compiles a test-only pre-commit seam INTO the refresh engine: a hook that fires
# after the intent is durably committed and the new tokens are staged, but BEFORE
# the commit transaction. The kill-9 conformance harness uses it to park a helper
# process at exactly that point so a parent test can SIGKILL it and prove
# reconciliation resolves the interrupted refresh to needs_reauth. OFF by default —
# the release vault contains no block-before-commit code path at all (zero release
# surface for a security boundary).
kill9-test-seam = []

# The kill-9 helper process. Only buildable with the seam feature, so it never
# ships in a normal build. The conformance integration test spawns it via
# CARGO_BIN_EXE_kill9_refresh_helper.
[[bin]]
name = "kill9_refresh_helper"
path = "src/bin/kill9_refresh_helper.rs"
required-features = ["kill9-test-seam"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
cortexkit-store = { workspace = true }
cortexkit-lease = { workspace = true }
cortexkit-store-types = { workspace = true }
rusqlite = { workspace = true }
# tokio for the engine's per-credential single-flight async lock (sync feature is
# enough here; the binary brings the full runtime).
tokio = { workspace = true }
chacha20poly1305 = { workspace = true }
getrandom = { workspace = true }
zeroize = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
proptest = { workspace = true }
