[package]
name = "credentials-module"
version = "0.1.0"
edition = "2021"
publish = false
description = "The cortexkit-credentials subc module: registers a reserved ManagementSurface, serves the anonymous read surface (credential.get/status/report_auth_failure) over the subc wire, and runs the master-key-gated admin surface (put/import/invalidate/rotate_master_key) off the runtime channel."

# The supervised daemon exe. Named with the fleet-wide `ck-*` prefix (Activity
# Monitor grouping); the package stays `credentials-module` and the module_id
# stays `cortexkit-credentials`, so the keychain scope, lease, and storage are
# untouched — only the built executable's filename changes.
[[bin]]
name = "ck-credentials"
path = "src/main.rs"

# The admin CLI — the `ck creds` dispatcher target (`ck <domain>` execs `ck-<domain>`).
# Writes commit through the RUNNING module with --subc, or through the offline
# single-writer lease when the daemon is stopped. Deliberately near-but-distinct from
# the daemon exe name `ck-credentials`: visually distinct in a process list, and the
# dispatcher can never exec the daemon by domain name.
[[bin]]
name = "ck-creds"
path = "src/bin/credentials_cli.rs"

[dependencies]
credentials-core = { path = "../credentials-core" }
subc-protocol = { workspace = true }
subc-transport = { workspace = true }
cortexkit-store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# The CLI's `login` command stamps the minted token's expiry from wall-clock time.
chrono = { workspace = true }

[dev-dependencies]
subc-core = { workspace = true }
# Read the audit_log directly (after stopping the daemon to release the lease) so
# the on-the-wire malicious-client conformance test can assert the durable alarm
# rows its adversarial traffic raised actually landed.
rusqlite = { workspace = true }
