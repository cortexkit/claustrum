# Safety proofs appended only by ckdev-mutate prove at commons 46cc166b0df2edcfd14b3eb54ed6eeac588fed69 (0.8.0).
# Cargo rows allow 3600s builds and 600s tests. Core rows declare
# features = ["test-support"] (the crash-cut row adds kill9-test-seam); the runner
# applies a row's features to every cargo invocation, so every Rust row gets the
# --broad breadth audit.
# Reports stay under gitignored target/mutations/.
# The first four release arms retain their source sites and expected guards:
# online read_grants_from_conn (not the migration planner/read-only CLI path),
# the stale marker, the scoped vault-held kind fence, and the status wire field.
# Anchoring the scoped kind fence separately from the engine call survives TTL
# plumbing changes; the unique comment distinguishes it from the handle fence.

[[control]]
id = "status-wire-stale-pending-key"
guards = "status stale_pending wire key cannot be silently renamed"
file = "crates/credentials-module/src/read_surface.rs"
old = """
    #[serde(skip_serializing_if = "Option::is_none")]
    pub stale_pending: Option<bool>,"""
new = """
    #[serde(rename = "stalePending")] // NON-VACUITY BREAK
    #[serde(skip_serializing_if = "Option::is_none")]
    pub stale_pending: Option<bool>,"""
edits = []
test_file = "crates/credentials-module/src/main.rs"
runner = "cargo"
package = "credentials-module"
target = "--bin ck-claustrum"
expect_red = ["tests::the_status_wire_key_set_is_a_contract_and_a_rename_obliges_an_announcement"]
expect_message = "stale_pending"
only = false
timeout_s = 600
build_timeout_s = 3600


