[control.select]
tests = ["audit::vocabulary_documentation_tests::auth_event_kind_values_are_documented", "agent_secret::totp::tests::secret_totp_matches_all_rfc6238_appendix_b_vectors"]


# S5 operator CLI: the operator door must keep the deposit door's storage invariants.
# Each row states the property, the one-line break, and the test that must go red.

[[control]]
id = "secret-operator-put-keeps-names-create-only"
guards = "An operator put never overwrites a live or corrupt secret under the same name"
file = "crates/credentials-core/src/store_secret_operator.rs"
old = """            if exists {
                return Ok(Err(SecretError::NameExists));
            }"""
new = """            if false { // NON-VACUITY BREAK
                return Ok(Err(SecretError::NameExists));
            }"""
edits = []
test_file = "crates/credentials-core/src/store_secret_operator_tests.rs"
runner = "cargo"
package = "credentials-core"
target = "--lib"
features = ["test-support"]
expect_red = ["store::store_agent_secrets::operator_tests::operator_put_is_create_only_for_live_and_corrupt_rows"]
expect_message = "name_exists"
only = false
timeout_s = 600
build_timeout_s = 3600


[[control]]
id = "secret-operator-put-reads-the-name-before-writing"
